# Build the site with Astro and publish dist/ to GitHub Pages.
# Phase 9 (deployment) started 2026-09-11 at the author's request (doc 09).
# One-time repository setting: Pages → Build and deployment → Source =
# "GitHub Actions". The Node major matches .node-version; the pnpm version
# matches the packageManager field in package.json.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: "24"
          package-manager: pnpm@11.23.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
