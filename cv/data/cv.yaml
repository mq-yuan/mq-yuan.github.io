# Public CV-only data. Facts shared with the site (name, contacts, education,
# experience, works, interests) live in src/content/data/ and src/content/works/
# and are read by cv/cv.typ directly; never duplicate them here. Research
# projects and private contact details live in cv/data/private/ (git-ignored).
# VERIFIED VALUES ONLY, same rule as profile.yaml.

website: "https://mq-yuan.github.io"

# Work ids (file names under src/content/works/) to list, in display order.
# Typst cannot enumerate a directory, so new papers are added here by hand.
publications:
  - comgs

# Research directions on the header line, in the order of the research
# identity (reconstruction first, synthetic data second; settled 2026-09-15).
# The site's interests lead with relighting and are not used here.
directions:
  - "Feed-forward 3D reconstruction"
  - "Scalable synthetic training data for reconstruction models"

# Research focus paragraph under the header (Typst markup). Framing settled
# 2026-09-15: feed-forward reconstruction is the core line; scalable synthetic
# data is the second line and serves reconstruction; editable and renderable
# representations stay inside the first line, never a third one.
focus: >-
  I study feed-forward 3D reconstruction from limited visual observations:
  predicting realistic, editable and renderable 3D Gaussian scenes from a
  single image or panorama, efficiently and at scale. Because controllable
  scene-level training data is a key bottleneck for such models, my second
  line of work focuses on scalable synthetic scene generation, from controlled
  benchmarks to reusable procedural pipelines, that supplies diverse training
  scenes for reconstruction models.

# Two-line version for the one-page CV.
focus_short: >-
  I study feed-forward 3D reconstruction from limited visual observations, such
  as a single image or panorama, together with scalable synthetic scene
  generation that provides controllable training data for such models.

# One line; a PhD CV does not need a skills matrix (author, 2026-09-14).
technical_background: "Python, PyTorch, CUDA, 3D Gaussian splatting, differentiable and physically based rendering, diffusion models, Blender, Unreal Engine."
