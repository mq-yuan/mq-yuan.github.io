<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="With a remote server: the proxy client forwards the domain inside the proxy protocol; the server resolves it and connects">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c5c64"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5da8"/></marker></defs>
  <rect width="640" height="400" fill="#f2f2ed"/>
  <rect x="125.0" y="20.0" width="150" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="200" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Browser</text>
  <rect x="125.0" y="100.0" width="150" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="200" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Proxy client</text>
  <rect x="125.0" y="180.0" width="150" height="40" rx="6" fill="#ffffff" stroke="#2f5da8" stroke-width="1.2"/>
  <text x="200" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Remote server</text>
  <rect x="115.0" y="260.0" width="170" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="200" y="285" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Server-side resolver</text>
  <rect x="105.0" y="340.0" width="190" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">TCP connect from server</text>
  <path d="M200.0 60.0 L200.0 100.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="208.0" y="84.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">SOCKS5 stream (domain inside)</text>
  <path d="M200.0 140.0 L200.0 180.0" stroke="#2f5da8" stroke-width="1.3" fill="none" marker-end="url(#b)"/>
  <text x="208.0" y="164.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">proxy protocol (domain inside)</text>
  <path d="M200.0 220.0 L200.0 260.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="208.0" y="244.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">getaddrinfo on the server</text>
  <path d="M200.0 300.0 L200.0 340.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="208.0" y="324.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">IP</text>
</svg>
