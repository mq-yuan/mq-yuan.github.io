<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="IP rules: the proxy client resolves locally to get an IP, matches it, then either sends the domain to the server or connects directly with that IP">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c5c64"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5da8"/></marker></defs>
  <rect width="640" height="300" fill="#f2f2ed"/>
  <rect x="30.0" y="40.0" width="120" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="90" y="65" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Browser</text>
  <rect x="245.0" y="40.0" width="150" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="320" y="65" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Proxy client</text>
  <rect x="235.0" y="130.0" width="170" height="40" rx="6" fill="#ffffff" stroke="#2f5da8" stroke-width="1.2"/>
  <text x="320" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Local resolve, get IP</text>
  <rect x="260.0" y="220.0" width="120" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="320" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">IP rules</text>
  <rect x="15.0" y="220.0" width="190" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="110" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Connect with that IP</text>
  <rect x="420.0" y="220.0" width="200" height="40" rx="6" fill="#ffffff" stroke="#5c5c64" stroke-width="1.2"/>
  <text x="520" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1f1f24">Server gets the domain</text>
  <path d="M150.0 60.0 L245.0 60.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="197.5" y="53.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">domain inside</text>
  <path d="M320.0 80.0 L320.0 130.0" stroke="#2f5da8" stroke-width="1.3" fill="none" marker-end="url(#b)"/>
  <text x="328.0" y="109.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">domain</text>
  <path d="M320.0 170.0 L320.0 220.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="328.0" y="199.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">IP</text>
  <path d="M260.0 240.0 L205.0 240.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="232.5" y="233.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">direct</text>
  <path d="M380.0 240.0 L420.0 240.0" stroke="#8a8a92" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="400.0" y="233.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5c5c64">proxy</text>
</svg>
