  # data as the second line that serves it. SynCom is public with the ComGS
  # code; the Insta360 work stays at "feed-forward 3D reconstruction".
  bio: "I spent the first year of my master's on ComGS, which composes
    reconstructed 3D objects into Gaussian-splatting scenes with consistent
    lighting and shadows; alongside the method I built SynCom, a controlled
    synthetic benchmark for object-scene composition rendered in Blender. The
    project appeared at ICLR 2026. Since October 2025 I have been a research
    intern at Insta360, where I work on feed-forward 3D reconstruction; the
    internship runs through October 2026. Working on reconstruction models
    has also made me care about the scene-level training data they need,
    which is why controllable synthetic data generation has become my second
    line of work."
